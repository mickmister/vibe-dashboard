<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Durable surface opening contract</title></head>
  <body>
    <nav aria-label="Surface actions">
      <button id="open-code-beside" type="button">Open Code beside</button>
      <button id="open-forms-beside" type="button">Open Forms beside</button>
      <button id="open-code-maximized" type="button">Open Code maximized</button>
      <button id="restore-layout" type="button" disabled>Restore layout</button>
      <button id="undo-layout" type="button" disabled>Undo layout</button>
      <button id="redo-layout" type="button" disabled>Redo layout</button>
      <button id="scenario-adjacent" type="button">Scenario: adjacent vs newer</button>
      <button id="remove-adjacency" type="button">Remove adjacency and activate newer</button>
      <button id="scenario-equal-ties" type="button">Scenario: equal MRU tie</button>
      <button id="scenario-missing-ties" type="button">Scenario: missing MRU tie</button>
      <button id="scenario-absent" type="button">Scenario: selected surface absent</button>
      <button id="scenario-narrow" type="button">Scenario: narrow viewport</button>
      <button id="concurrent-open" type="button">Run concurrent Open beside</button>
      <button id="reject-commit" type="button">Reject next atomic commit</button>
      <button id="evict-controller" type="button">Evict and restore controller</button>
      <button id="persist-reload" type="button">Persist and reload</button>
    </nav>
    <div id="surface-dockview" style="height: 420px; width: 900px"></div>
    <div id="runtime-layer" hidden></div>
    <output id="surface-status" aria-live="polite">loading</output>
    <script type="module" src="./surfaceOpeningHarness.ts"></script>
  </body>
</html>
