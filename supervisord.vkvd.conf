[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:vkuser

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
loglevel=info
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; code-server
[program:code-server]
command=sh -c 'if [ -n "${CODE_PASSWORD}" ] && [ "${CODE_PASSWORD}" != "__unset__" ]; then export PASSWORD="${CODE_PASSWORD}"; unset HASHED_PASSWORD; exec code-server --auth password --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; else unset PASSWORD HASHED_PASSWORD; exec code-server --auth none --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; fi'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_CODE_PORT)s",CODE_PASSWORD="%(ENV_CODE_PASSWORD)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser

; vibe-kanban (source-built binary with database backup before starting)
[program:vibe-kanban]
command=sh -c 'if [ "%(ENV_ENABLE_VIBE_KANBAN)s" != "true" ]; then echo "vibe-kanban disabled (ENABLE_VIBE_KANBAN != true)"; exit 0; fi; /usr/local/bin/backup-vibe-kanban-db.sh && exec /usr/local/bin/vibe-kanban'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_BACKEND_PORT)s",ENABLE_VIBE_KANBAN="%(ENV_ENABLE_VIBE_KANBAN)s",VK_BUILD_VERSION_FILE="/usr/local/share/vibe-kanban-build-version",VK_SHARED_API_BASE="%(ENV_VK_SHARED_API_BASE)s",VK_ALLOWED_ORIGINS="%(ENV_VK_ALLOWED_ORIGINS)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/repos

; vibe-dashboard
[program:vibe-dashboard]
command=node dist/node/node-entry.mjs
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_DASHBOARD_PORT)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/.local/share/vibe-dashboard-runtime

; gas-city-supervisor (machine-wide GC control plane)
[program:gas-city-supervisor]
command=sh -c 'if [ "${ENABLE_GAS_CITY_SUPERVISOR:-true}" != "true" ]; then echo "gas-city-supervisor disabled (ENABLE_GAS_CITY_SUPERVISOR != true)"; exit 0; fi; mkdir -p /home/vkuser/.gc /var/tmp/vibe-kanban/gc-runtime; exec gc supervisor run'
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
startsecs=2
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/vkuser",GC_HOME="/home/vkuser/.gc",XDG_RUNTIME_DIR="/var/tmp/vibe-kanban/gc-runtime",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser

; caddy
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; memory watchdog (Mattermost alerts for per-process and total RAM thresholds)
[program:memory-watchdog]
command=sh -c 'if [ "%(ENV_MEMORY_WATCHDOG_ENABLED)s" != "true" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_ENABLED != true)"; exec tail -f /dev/null; fi; if [ -z "%(ENV_MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL)s" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL is empty)"; exec tail -f /dev/null; fi; exec node /opt/vibe-kanban-vscode-web-seed/scripts/memory-watchdog.mjs'
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root
directory=/home/vkuser/repos/vibe-kanban-vscode-web

; process-exporter (grouped process metrics for Prometheus)
[program:process-exporter]
command=/usr/local/bin/process-exporter -config.path /etc/process-exporter/process-exporter.yml -web.listen-address=127.0.0.1:9256 -children=true -threads=false -remove-empty-groups
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root

; tailscaled (daemon must run as root, requires ENABLE_TAILSCALE=true)
[program:tailscaled]
command=sh -c 'if [ "%(ENV_ENABLE_TAILSCALE)s" != "true" ]; then echo "Tailscale disabled (ENABLE_TAILSCALE != true)"; exit 0; fi; exec /usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock'
autostart=true
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root

; tailscale up (requires ENABLE_TAILSCALE=true)
[program:tailscale-up]
command=sh -c 'if [ "%(ENV_ENABLE_TAILSCALE)s" != "true" ]; then echo "Tailscale disabled (ENABLE_TAILSCALE != true)"; exit 0; fi; sleep 2 && if [ -n "${TAILSCALE_AUTHKEY}" ]; then tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="${TAILSCALE_HOSTNAME:-vkdev}"; else tailscale up --hostname="${TAILSCALE_HOSTNAME:-vkdev}"; fi'
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root
