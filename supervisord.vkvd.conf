[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:vkuser

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
loglevel=info
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /etc/supervisor/conf.d/vd-generated/*.conf

; inner Docker daemon (requires the outer container to run with Sysbox)
[program:dockerd]
command=/usr/bin/dockerd --host=unix:///var/run/docker.sock --data-root=/var/lib/docker
autostart=true
autorestart=true
priority=5
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root

; code-server
[program:code-server]
command=sh -c 'if [ -n "${CODE_PASSWORD}" ] && [ "${CODE_PASSWORD}" != "__unset__" ]; then export PASSWORD="${CODE_PASSWORD}"; unset HASHED_PASSWORD; exec code-server --auth password --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; else unset PASSWORD HASHED_PASSWORD; exec code-server --auth none --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; fi'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_CODE_PORT)s",CODE_PASSWORD="%(ENV_CODE_PASSWORD)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser

; vibe-kanban (source-built binary with database backup before starting)
[program:vibe-kanban]
command=sh -c 'if [ "%(ENV_ENABLE_VIBE_KANBAN)s" != "true" ]; then echo "vibe-kanban disabled (ENABLE_VIBE_KANBAN != true)"; exit 0; fi; /usr/local/bin/backup-vibe-kanban-db.sh && exec /usr/local/bin/vibe-kanban'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_BACKEND_PORT)s",ENABLE_VIBE_KANBAN="%(ENV_ENABLE_VIBE_KANBAN)s",VK_BUILD_VERSION_FILE="/usr/local/share/vibe-kanban-build-version",VK_SHARED_API_BASE="%(ENV_VK_SHARED_API_BASE)s",VK_ALLOWED_ORIGINS="%(ENV_VK_ALLOWED_ORIGINS)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/repos

; vibe-dashboard
[program:vibe-dashboard]
command=node dist/node/node-entry.mjs
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_DASHBOARD_PORT)s",VD_PLUGIN_INSTALL_ROOT="/var/lib/vd/plugins",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/.local/share/vibe-dashboard-runtime

; vibe-agent nudge daemon (continues newly-stopped coding agent turns)
[program:vibe-agent-nudge-daemon]
command=sh -c 'if [ "${VD_NUDGE_DAEMON_ENABLED:-}" != "true" ]; then echo "vibe-agent nudge daemon disabled (VD_NUDGE_DAEMON_ENABLED != true)"; exec tail -f /dev/null; fi; exec node /opt/vibe-kanban-vscode-web-seed/dist/vibe-agent/nudge/daemon.js'
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=VIBE_API_URL="http://127.0.0.1:%(ENV_BACKEND_PORT)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/repos

; plugin service orchestrator (reconciles persisted per-instance plugin config into generated supervisor programs)
[program:vd-plugin-service-orchestrator-startup]
command=/usr/local/bin/vd-plugin-runtime-apply.sh
autostart=true
autorestart=false
startsecs=0
priority=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root

; caddy
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; memory watchdog (Mattermost alerts for per-process and total RAM thresholds)
[program:memory-watchdog]
command=sh -c 'if [ "%(ENV_MEMORY_WATCHDOG_ENABLED)s" != "true" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_ENABLED != true)"; exec tail -f /dev/null; fi; if [ -z "%(ENV_MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL)s" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL is empty)"; exec tail -f /dev/null; fi; exec node /opt/vibe-kanban-vscode-web-seed/scripts/memory-watchdog.mjs'
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/usr/local/lib/vk-bd-wrapper/bin:/var/lib/vd/plugin-bin:/var/lib/vd/toolchains/bin:/var/lib/vd/toolchains/npm/bin:/home/vkuser/.npm-global/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root
directory=/home/vkuser/repos/vibe-kanban-vscode-web

; process-exporter (grouped process metrics for Prometheus)
[program:process-exporter]
command=/usr/local/bin/process-exporter -config.path /etc/process-exporter/process-exporter.yml -web.listen-address=0.0.0.0:9256 -children=true -threads=false -remove-empty-groups
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/usr/local/lib/vk-bd-wrapper/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root

; tailscaled (daemon must run as root, requires ENABLE_TAILSCALE=true)
[program:tailscaled]
command=sh -c 'if [ "%(ENV_ENABLE_TAILSCALE)s" != "true" ]; then echo "Tailscale disabled (ENABLE_TAILSCALE != true)"; exit 0; fi; exec /usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock'
autostart=true
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root

; tailscale up (requires ENABLE_TAILSCALE=true)
[program:tailscale-up]
command=sh -c 'if [ "%(ENV_ENABLE_TAILSCALE)s" != "true" ]; then echo "Tailscale disabled (ENABLE_TAILSCALE != true)"; exit 0; fi; sleep 2 && if [ -n "${TAILSCALE_AUTHKEY}" ]; then tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="${TAILSCALE_HOSTNAME:-vkdev}"; else tailscale up --hostname="${TAILSCALE_HOSTNAME:-vkdev}"; fi'
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=root
