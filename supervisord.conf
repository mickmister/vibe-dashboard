[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:vkuser

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
loglevel=info
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; code-server
[program:code-server]
command=sh -c 'if [ -n "${CODE_PASSWORD}" ] && [ "${CODE_PASSWORD}" != "__unset__" ]; then export PASSWORD="${CODE_PASSWORD}"; unset HASHED_PASSWORD; exec code-server --auth password --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; else unset PASSWORD HASHED_PASSWORD; exec code-server --auth none --bind-addr 0.0.0.0:%(ENV_CODE_PORT)s --idle-timeout-seconds=3600; fi'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_CODE_PORT)s",CODE_PASSWORD="%(ENV_CODE_PASSWORD)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config"
user=vkuser

; vibe-kanban (with database backup before starting)
[program:vibe-kanban]
command=sh -c 'if [ "%(ENV_ENABLE_VIBE_KANBAN)s" != "true" ]; then echo "vibe-kanban disabled (ENABLE_VIBE_KANBAN != true)"; exit 0; fi; /usr/local/bin/backup-vibe-kanban-db.sh && npx vibe-kanban@${VIBE_KANBAN_VERSION:-latest}'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_BACKEND_PORT)s",ENABLE_VIBE_KANBAN="%(ENV_ENABLE_VIBE_KANBAN)s",VIBE_KANBAN_VERSION="%(ENV_VIBE_KANBAN_VERSION)s",VK_SHARED_API_BASE="%(ENV_VK_SHARED_API_BASE)s",VK_ALLOWED_ORIGINS="%(ENV_VK_ALLOWED_ORIGINS)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/repos

; vibe-dashboard
[program:vibe-dashboard]
command=sh -c 'git pull || true && pnpm i && npm rebuild better-sqlite3 && npm run build && npm start'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOST="0.0.0.0",PORT="%(ENV_DASHBOARD_PORT)s",HOME="/home/vkuser",XDG_CONFIG_HOME="/home/vkuser/.config",PATH="/home/vkuser/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=vkuser
directory=/home/vkuser/repos/vibe-kanban-vscode-web

; caddy
[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; memory watchdog (Mattermost alerts for per-process and total RAM thresholds)
[program:memory-watchdog]
command=sh -c 'if [ "%(ENV_MEMORY_WATCHDOG_ENABLED)s" != "true" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_ENABLED != true)"; exec tail -f /dev/null; fi; if [ -z "%(ENV_MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL)s" ]; then echo "memory-watchdog disabled (MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL is empty)"; exec tail -f /dev/null; fi; exec node /opt/vibe-kanban-vscode-web-seed/scripts/memory-watchdog.mjs'
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/root",PATH="/home/vkuser/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
user=root
directory=/home/vkuser/repos/vibe-kanban-vscode-web

