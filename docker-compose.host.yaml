# Host networking override — use with:
#   docker compose -f docker-compose.yaml -f docker-compose.host.yaml up
#
# Removes port mappings and uses the host network directly.
# All container ports are exposed on the host without mapping.
# Useful when running behind a host-level Tailscale or reverse proxy.
services:
  code-vibe:
    network_mode: host
    ports: !reset []
