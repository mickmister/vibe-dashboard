services:
  code-vibe:
    build:
      context: .
      dockerfile: Dockerfile.vkvd
      args:
        VK_REPO_URL: ${VK_REPO_URL:-https://github.com/mickmister/vibe-kanban.git}
        VK_BRANCH: ${VK_BRANCH:-main}
        VK_COMMIT: ${VK_COMMIT:-}
    # image: ghcr.io/mickmister/vk-vd:${VKVD_IMAGE_VERSION:-latest}
    # pull_policy: always

    ports:
      - "${CADDY_PORT:-3001}:${CADDY_PORT:-3001}"
    mem_limit: ${DEV_CONTAINER_MEM_LIMIT:-14g}
    mem_reservation: ${DEV_CONTAINER_MEM_RESERVATION:-12g}

    # Required for Tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      CADDY_PORT: ${CADDY_PORT:-3001}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-localhost}
      BACKEND_PORT: ${BACKEND_PORT:-3007}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3005}
      CODE_PORT: ${CODE_PORT:-3008}
      XDG_CONFIG_HOME: /home/vkuser/.config

      CODE_PASSWORD: ${CODE_PASSWORD:-__unset__}
      SUDO_PASSWORD: ${SUDO_PASSWORD}
      ENABLE_VIBE_KANBAN: ${ENABLE_VIBE_KANBAN:-true}

      # ENABLE_BOSUN: ${ENABLE_BOSUN:-false}

      ENABLE_TAILSCALE: ${ENABLE_TAILSCALE:-false}
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-vkdev}

      MEMORY_WATCHDOG_ENABLED: ${MEMORY_WATCHDOG_ENABLED:-false}
      MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL: ${MEMORY_WATCHDOG_MATTERMOST_WEBHOOK_URL:-}
      MEMORY_WATCHDOG_PROCESS_THRESHOLD_MB: ${MEMORY_WATCHDOG_PROCESS_THRESHOLD_MB:-4096}
      MEMORY_WATCHDOG_TOTAL_THRESHOLD_PERCENT: ${MEMORY_WATCHDOG_TOTAL_THRESHOLD_PERCENT:-60}

      # VK Cloud connection (optional - if set, local VK connects to this cloud instance)
      # Uses VK_SHARED_API_BASE (PR #2769) for runtime API URL configuration
      VK_SHARED_API_BASE: ${VK_SHARED_API_BASE:-}
      # Optional CORS allowlist for vibe-kanban backend
      VK_ALLOWED_ORIGINS: ${VK_ALLOWED_ORIGINS:-}
      # Startup diagnostics / startup-component bisect flags
      VK_DISABLE_EXECUTOR_PRELOAD: ${VK_DISABLE_EXECUTOR_PRELOAD:-false}
      VK_DISABLE_RELAY_STARTUP: ${VK_DISABLE_RELAY_STARTUP:-false}
      VK_DISABLE_STARTUP_BACKFILLS: ${VK_DISABLE_STARTUP_BACKFILLS:-false}
      VK_DISABLE_BACKFILL_BEFORE_HEAD_COMMITS: ${VK_DISABLE_BACKFILL_BEFORE_HEAD_COMMITS:-false}
      VK_DISABLE_BACKFILL_REPO_NAMES: ${VK_DISABLE_BACKFILL_REPO_NAMES:-false}
      VK_STARTUP_DIAGNOSTICS_INTERVAL_MS: ${VK_STARTUP_DIAGNOSTICS_INTERVAL_MS:-}
      VK_STARTUP_DIAGNOSTICS_DURATION_SECONDS: ${VK_STARTUP_DIAGNOSTICS_DURATION_SECONDS:-}

      # GitHub workflow_run webhook secret for CI failure notifications
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}

    volumes:
      # Mount Docker socket for Docker-in-Docker support
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist git repositories
      # - ~/repos:/home/vkuser/repos
      - vibe-kanban-repos:/home/vkuser/repos
      # Persist vibe-kanban database and data
      - vibe-kanban-data:/home/vkuser/.local/share/vibe-kanban
      # Persist worktrees
      - vibe-kanban-worktrees:/var/tmp/vibe-kanban/worktrees
      # Persist vibe-dashboard application data only; runtime code is reseeded from the image
      - vibe-dashboard-data:/home/vkuser/.local/share/vibe-dashboard-runtime/data
      # Persist VD plugin instance config, downloaded release assets, installed plugin versions,
      # and plugin runtime state. Generated supervisor config is recreated from this state.
      - vibe-dashboard-plugin-data:/var/lib/vd
      # Persist code-server settings (optional, but allows user customizations to persist)
      - code-server-data:/home/vkuser/.local/share/code-server
      # Persist Claude Code data
      - claude-data:/home/vkuser/.claude
      # Persist Codex CLI/IDE auth cache (~/.codex/auth.json)
      - codex-data:/home/vkuser/.codex
      # Persist GitHub CLI authentication
      - gh-config:/home/vkuser/.config/gh
      # Persist Git global config (user.name, user.email, etc.)
      - git-config:/home/vkuser/.config/git
      # Persist npm cache (speeds up installs)
      - npm-cache:/home/vkuser/.npm
      # Persist user-local npm global installs made as vkuser
      - npm-global:/home/vkuser/.npm-global
      # Persist pnpm store
      - pnpm-store:/home/vkuser/.local/share/pnpm
      # Persist Tailscale state (so you don't need to re-authenticate)
      - tailscale-state:/var/lib/tailscale
      # Persist Bosun config (workspaces, .env, bosun.config.json)
      - bosun-data:/home/vkuser/bosun

  novnc:
    profiles:
      - novnc
    image: ${NOVNC_IMAGE:-lscr.io/linuxserver/chromium:latest}
    restart: unless-stopped
    shm_size: ${NOVNC_SHM_SIZE:-1gb}
    environment:
      PUID: ${NOVNC_PUID:-1000}
      PGID: ${NOVNC_PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CHROME_CLI: ${NOVNC_CHROME_CLI:---remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank}
      CUSTOM_USER: ${NOVNC_USER:-}
      PASSWORD: ${NOVNC_PASSWORD:-}
    expose:
      - "3000"
      - "3001"
      - "9222"
    volumes:
      # Stores the Chromium profile, cookies, localStorage, extensions, and settings.
      - novnc-data:/config
    ports:
        - "127.0.0.1:${NOVNC_UI_PORT:-3090}:3000"
        - "127.0.0.1:${NOVNC_CDP_PORT:-9223}:9222"

  novnc-cdp:
    profiles:
      - novnc
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - novnc
    network_mode: service:novnc
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        addr="$$(hostname -i | awk '{print $$1}')"
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen __NOVNC_ADDR__:9222;
          server_name _;

          location / {
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:9222;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter 'ws://127.0.0.1:9222/' 'ws://$$http_host/';
            sub_filter_once off;
            proxy_pass http://127.0.0.1:9222;
          }
        }
        EOF
        sed -i "s/__NOVNC_ADDR__/$${addr}/g" /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  prometheus:
    image: prom/prometheus:v3.4.0
    user: "0:0"
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    mem_reservation: ${PROMETHEUS_MEM_RESERVATION:-256m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=${PROMETHEUS_WEB_LISTEN_ADDRESS:-127.0.0.1:9091}
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  vibe-kanban-repos:
  vibe-kanban-data:
  vibe-kanban-worktrees:
  vibe-dashboard-data:
  vibe-dashboard-plugin-data:
  code-server-data:
  claude-data:
  gh-config:
  git-config:
  codex-data:
  npm-global:
  npm-cache:
  pnpm-store:
  tailscale-state:
  bosun-data:
  novnc-data:
  prometheus-data:
