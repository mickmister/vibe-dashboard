name: E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mattermost-webhook-e2e:
    name: Mattermost VK webhook e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm run test:vk-webhook:e2e
