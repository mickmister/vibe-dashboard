name: Publish VK/VD Image to GHCR

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: latest

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  compute-image-vars:
    runs-on: ubuntu-latest
    outputs:
      vk_vd_runpod_image_name: ${{ steps.compute.outputs.vk_vd_runpod_image_name }}
      vk_vd_image_tag: ${{ steps.compute.outputs.vk_vd_image_tag }}
      vk_vd_sha_tag: ${{ steps.compute.outputs.vk_vd_sha_tag }}
    steps:
      - name: Compute image metadata
        id: compute
        run: |
          {
            echo "vk_vd_runpod_image_name=ghcr.io/${{ github.repository_owner }}/vk-vd-runpod"
            echo "vk_vd_image_tag=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}"
            echo "vk_vd_sha_tag=${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

  publish-runpod:
    needs: compute-image-vars
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./Dockerfile.runpod
      platforms: linux/amd64,linux/arm64
      build-args: |
        BASE_IMAGE=ghcr.io/mickmister/vk-vd:05e2b3fe7f116a297435b3bb6297e9d49a5da520
      cache: true
      cache-scope: vk-vd-runpod-multiarch
      meta-images: ${{ needs['compute-image-vars'].outputs.vk_vd_runpod_image_name }}
      meta-tags: |
        type=raw,value=${{ needs['compute-image-vars'].outputs.vk_vd_image_tag }}
        type=raw,value=${{ needs['compute-image-vars'].outputs.vk_vd_sha_tag }}
        type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
