name: Publish VK/VD Image to GHCR

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: latest
      vk_branch:
        description: vibe-kanban git branch, tag, or sha to build from
        required: true
        default: vk/ed5f-vk-debug-memory
      vk_repo_url:
        description: vibe-kanban git repository URL to clone
        required: true
        default: https://github.com/mickmister/vibe-kanban.git

permissions:
  contents: read
  packages: write
  id-token: write

env:
  VK_VD_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vk-vd
  VK_VD_RUNPOD_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/vk-vd-runpod
  VK_VD_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('pr-{0}', github.event.pull_request.number) }}
  VK_VD_SHA_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  resolve-vk-ref:
    runs-on: ubuntu-latest
    outputs:
      vk_branch: ${{ steps.resolve.outputs.vk_branch }}
      vk_commit: ${{ steps.resolve.outputs.vk_commit }}
      vk_repo_url: ${{ steps.resolve.outputs.vk_repo_url }}
    steps:
      - name: Resolve vibe-kanban ref to commit SHA
        id: resolve
        env:
          VK_BRANCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.vk_branch || 'vk/ed5f-vk-debug-memory' }}
          VK_REPO_URL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.vk_repo_url || 'https://github.com/mickmister/vibe-kanban.git' }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          git -C "$workdir" init --quiet
          git -C "$workdir" remote add origin "$VK_REPO_URL_INPUT"
          git -C "$workdir" fetch --depth 1 origin "$VK_BRANCH_INPUT"

          vk_commit="$(git -C "$workdir" rev-parse FETCH_HEAD)"

          echo "Resolved $VK_BRANCH_INPUT to $vk_commit"

          {
            echo "vk_branch=$VK_BRANCH_INPUT"
            echo "vk_commit=$vk_commit"
            echo "vk_repo_url=$VK_REPO_URL_INPUT"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-vk-ref
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./Dockerfile.vkvd
      platforms: linux/amd64,linux/arm64
      build-args: |
        VK_BRANCH=${{ needs.resolve-vk-ref.outputs.vk_branch }}
        VK_COMMIT=${{ needs.resolve-vk-ref.outputs.vk_commit }}
        VK_REPO_URL=${{ needs.resolve-vk-ref.outputs.vk_repo_url }}
      cache: true
      cache-scope: vk-vd-multiarch
      meta-images: ${{ env.VK_VD_IMAGE_NAME }}
      meta-tags: |
        type=raw,value=${{ env.VK_VD_IMAGE_TAG }}
        type=raw,value=${{ env.VK_VD_SHA_TAG }}
        type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-runpod:
    needs: [resolve-vk-ref, publish]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./Dockerfile.runpod
      platforms: linux/amd64,linux/arm64
      build-args: |
        BASE_IMAGE=${{ env.VK_VD_IMAGE_NAME }}:${{ env.VK_VD_IMAGE_TAG }}
      cache: true
      cache-scope: vk-vd-runpod-multiarch
      meta-images: ${{ env.VK_VD_RUNPOD_IMAGE_NAME }}
      meta-tags: |
        type=raw,value=${{ env.VK_VD_IMAGE_TAG }}
        type=raw,value=${{ env.VK_VD_SHA_TAG }}
        type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

