name: Publish VK/VD Image to GHCR

on:
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: latest
      vk_branch:
        description: vibe-kanban git branch or tag to build from
        required: true
        default: vk/ed5f-vk-debug-memory
      vk_repo_url:
        description: vibe-kanban git repository URL to clone
        required: true
        default: https://github.com/mickmister/vibe-kanban.git

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./Dockerfile.vkvd
      platforms: linux/amd64,linux/arm64
      build-args: |
        VK_BRANCH=${{ github.event_name == 'workflow_dispatch' && inputs.vk_branch || 'vk/ed5f-vk-debug-memory' }}
        VK_REPO_URL=${{ github.event_name == 'workflow_dispatch' && inputs.vk_repo_url || 'https://github.com/mickmister/vibe-kanban.git' }}
      cache: true
      cache-scope: vk-vd-multiarch
      meta-images: ghcr.io/${{ github.repository_owner }}/vk-vd
      meta-tags: |
        type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('pr-{0}', github.event.pull_request.number) }}
        type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
