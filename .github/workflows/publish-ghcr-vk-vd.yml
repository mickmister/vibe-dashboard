name: Publish VK/VD Image to GHCR

on:
  push:
    branches:
      - '**'
  repository_dispatch:
    types:
      - vk-release-assets-ready
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: manual
      vk_branch:
        description: vibe-kanban git branch, tag, or sha to build from
        required: true
        default: main
      vk_repo_url:
        description: vibe-kanban git repository URL to clone
        required: true
        default: https://github.com/mickmister/vibe-kanban.git

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: vk-vd-publish-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.vk_source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-vk-ref:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      vk_branch: ${{ steps.resolve.outputs.vk_branch }}
      vk_commit: ${{ steps.resolve.outputs.vk_commit }}
      vk_short_commit: ${{ steps.resolve.outputs.vk_short_commit }}
      vk_repo_url: ${{ steps.resolve.outputs.vk_repo_url }}
      vd_short_commit: ${{ steps.resolve.outputs.vd_short_commit }}
      publish_latest: ${{ steps.resolve.outputs.publish_latest }}
    steps:
      - name: Resolve vibe-kanban ref to commit SHA
        id: resolve
        env:
          IMAGE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          VK_BRANCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.vk_branch || github.event.client_payload.vk_sha || github.event.client_payload.vk_ref || 'main' }}
          # Repository dispatch intentionally ignores client_payload.vk_repo_url.
          # Docker release assets are trusted only from the official VK repository.
          VK_REPO_URL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.vk_repo_url || 'https://github.com/mickmister/vibe-kanban.git' }}
          VK_SOURCE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.vk_source_ref || '' }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir" || true' EXIT

          git -C "$workdir" init --quiet
          git -C "$workdir" remote add origin "$VK_REPO_URL_INPUT"
          git -C "$workdir" fetch --depth 1 origin "$VK_BRANCH_INPUT"

          vk_commit="$(git -C "$workdir" rev-parse FETCH_HEAD)"
          vk_short_commit="$(git -C "$workdir" rev-parse --short=7 FETCH_HEAD)"
          vd_short_commit="${GITHUB_SHA:0:7}"
          used_asset_fallback=false

          manifest_url="https://github.com/mickmister/vibe-kanban/releases/download/vk-assets-${vk_commit}/manifest.json"
          manifest_mode="$(python3 -c 'import json,sys,urllib.request; request=urllib.request.Request(sys.argv[1], headers={"User-Agent":"vibe-dashboard-vk-assets-resolver"}); print(json.load(urllib.request.urlopen(request, timeout=10)).get("mode", ""))' "$manifest_url" 2>/dev/null || true)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "$VK_BRANCH_INPUT" == "main" && "$manifest_mode" != "linux-container-runtime" ]]; then
            echo "::notice::Compatible VK release assets for $vk_commit are not available yet (mode: ${manifest_mode:-unavailable}); using the latest published linux-container-runtime vk-assets release for this VD branch image."
            releases_json="$workdir/vk-releases.json"
            curl -fsSL "https://api.github.com/repos/mickmister/vibe-kanban/releases?per_page=100" -o "$releases_json"
            latest_assets_tag=""
            while read -r candidate_tag; do
              manifest_url="https://github.com/mickmister/vibe-kanban/releases/download/${candidate_tag}/manifest.json"
              manifest_mode="$(python3 -c 'import json,sys,urllib.request; request=urllib.request.Request(sys.argv[1], headers={"User-Agent":"vibe-dashboard-vk-assets-resolver"}); print(json.load(urllib.request.urlopen(request, timeout=10)).get("mode", ""))' "$manifest_url" 2>/dev/null || true)"
              if [[ "$manifest_mode" == "linux-container-runtime" ]]; then
                latest_assets_tag="$candidate_tag"
                break
              fi
              echo "Skipping $candidate_tag because manifest mode is ${manifest_mode:-unavailable}."
            done < <(python3 -c 'import json,sys; releases=[r for r in json.load(open(sys.argv[1], encoding="utf-8")) if r.get("tag_name", "").startswith("vk-assets-")]; releases.sort(key=lambda r: r.get("published_at") or r.get("created_at") or "", reverse=True); print("\n".join(r["tag_name"] for r in releases))' "$releases_json")

            if [[ -z "$latest_assets_tag" ]]; then
              echo "No published linux-container-runtime vk-assets release found to use as a fallback." >&2
              exit 1
            fi

            vk_commit="${latest_assets_tag#vk-assets-}"
            if [[ ! "$vk_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Latest vk-assets release tag does not contain a full commit SHA: $latest_assets_tag" >&2
              exit 1
            fi

            VK_BRANCH_INPUT="$latest_assets_tag"
            vk_short_commit="${vk_commit:0:7}"
            used_asset_fallback=true
            echo "Using fallback VK assets release $latest_assets_tag"
          fi

          publish_latest=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "$used_asset_fallback" != "true" ]]; then
            publish_latest=true
          elif [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            git -C "$workdir" fetch --depth 1 origin main
            vk_main_commit="$(git -C "$workdir" rev-parse FETCH_HEAD)"

            if [[ "$vk_commit" == "$vk_main_commit" ]]; then
              publish_latest=true
            else
              echo "Dispatched VK commit $vk_commit is not current origin/main ($vk_main_commit); not publishing latest."
            fi
          fi

          echo "Resolved $VK_BRANCH_INPUT to $vk_commit"
          echo "Publish latest: $publish_latest"

          {
            echo "image_tag=$IMAGE_TAG_INPUT"
            echo "vk_branch=$VK_BRANCH_INPUT"
            echo "vk_commit=$vk_commit"
            echo "vk_short_commit=$vk_short_commit"
            echo "vk_repo_url=$VK_REPO_URL_INPUT"
            echo "vd_short_commit=$vd_short_commit"
            echo "publish_latest=$publish_latest"
          } >> "$GITHUB_OUTPUT"

  check-types:
    name: npm run check-types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: npm run check-types

  publish:
    needs: [resolve-vk-ref, check-types]
    uses: ./.github/workflows/docker-github-builder-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: ./Dockerfile.vkvd
      platforms: linux/amd64,linux/arm64
      build-args: |
        VK_BRANCH=${{ needs.resolve-vk-ref.outputs.vk_branch }}
        VK_COMMIT=${{ needs.resolve-vk-ref.outputs.vk_commit }}
        VK_REPO_URL=${{ needs.resolve-vk-ref.outputs.vk_repo_url }}
      cache: true
      cache-scope: vk-vd-multiarch
      sign: false
      meta-images: ghcr.io/${{ github.repository_owner }}/vk-vd
      meta-tags: |
        type=raw,value=${{ needs.resolve-vk-ref.outputs.image_tag }},enable=${{ needs.resolve-vk-ref.outputs.image_tag != '' }}
        type=raw,value=vk-${{ needs.resolve-vk-ref.outputs.vk_short_commit }}-vd-${{ needs.resolve-vk-ref.outputs.vd_short_commit }}
        type=raw,value=latest,enable=${{ needs.resolve-vk-ref.outputs.publish_latest == 'true' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
