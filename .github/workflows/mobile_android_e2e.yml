name: mobile_e2e

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run E2E for
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - ios

jobs:
  mobile-e2e:
    name: ${{ matrix.platform }} ${{ matrix.test_mode }} mobile E2E
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'android' && '[{"platform":"android","test_mode":"webview","runner":"ubuntu-latest","eas_platform":"android","eas_profile":"mobile-e2e","site_url":"http://10.0.2.2:1337","appium_driver":"uiautomator2","use_webview_shell":"true"},{"platform":"android","test_mode":"native","runner":"ubuntu-latest","eas_platform":"android","eas_profile":"mobile-e2e-native","site_url":"http://10.0.2.2:1337","appium_driver":"uiautomator2","use_webview_shell":"false"}]' || inputs.platform == 'ios' && '[{"platform":"ios","test_mode":"webview","runner":"macos-15","eas_platform":"ios","eas_profile":"mobile-e2e-ios-simulator","site_url":"http://127.0.0.1:1337","appium_driver":"xcuitest","use_webview_shell":"true"},{"platform":"ios","test_mode":"native","runner":"macos-15","eas_platform":"ios","eas_profile":"mobile-e2e-ios-simulator-native","site_url":"http://127.0.0.1:1337","appium_driver":"xcuitest","use_webview_shell":"false"}]' || '[{"platform":"android","test_mode":"webview","runner":"ubuntu-latest","eas_platform":"android","eas_profile":"mobile-e2e","site_url":"http://10.0.2.2:1337","appium_driver":"uiautomator2","use_webview_shell":"true"},{"platform":"android","test_mode":"native","runner":"ubuntu-latest","eas_platform":"android","eas_profile":"mobile-e2e-native","site_url":"http://10.0.2.2:1337","appium_driver":"uiautomator2","use_webview_shell":"false"},{"platform":"ios","test_mode":"webview","runner":"macos-15","eas_platform":"ios","eas_profile":"mobile-e2e-ios-simulator","site_url":"http://127.0.0.1:1337","appium_driver":"xcuitest","use_webview_shell":"true"},{"platform":"ios","test_mode":"native","runner":"macos-15","eas_platform":"ios","eas_profile":"mobile-e2e-ios-simulator-native","site_url":"http://127.0.0.1:1337","appium_driver":"xcuitest","use_webview_shell":"false"}]') }}
    env:
      MOBILE_E2E_SITE_URL: ${{ matrix.site_url }}
      HOST_SITE_URL: http://127.0.0.1:1337
      PORT: '1337'
      SERVER_PORT: '1337'
      ARTIFACTS_DIR: artifacts/mobile-e2e/${{ matrix.platform }}-${{ matrix.test_mode }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server bundle
        run: pnpm run build
        env:
          PORT: ${{ env.PORT }}
          SERVER_PORT: ${{ env.SERVER_PORT }}

      - name: Prepare static assets for node server
        run: cp -R dist/browser/. dist/

      - name: Build mobile app with EAS local mode
        working-directory: apps/mobile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$ARTIFACTS_DIR"
          eas build --non-interactive --wait --platform "${{ matrix.eas_platform }}" --profile "${{ matrix.eas_profile }}" --local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_GITHUB_ACTIONS_RUN: 'true'
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/mobile-e2e/${{ matrix.platform }}-${{ matrix.test_mode }}
          APP_PROFILE: mobile-e2e
          EXPO_APP_PROFILE: mobile-e2e
          PUBLIC_SITE_URL: ${{ env.MOBILE_E2E_SITE_URL }}
          EXPO_PUBLIC_SITE_URL: ${{ env.MOBILE_E2E_SITE_URL }}
          EXPO_LOAD_WEBVIEW_FROM_SITE_URL: 'true'
          EXPO_USE_WEBVIEW_SHELL: ${{ matrix.use_webview_shell }}

      - name: Locate mobile app artifact
        id: app
        shell: bash
        run: |
          set -euo pipefail
          artifacts_dir="$ARTIFACTS_DIR"

          if [ "${{ matrix.platform }}" = "ios" ]; then
            archive_path="$(find "$artifacts_dir" -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | head -n 1 || true)"
            if [ -n "$archive_path" ]; then
              extract_dir="$artifacts_dir/extracted"
              mkdir -p "$extract_dir"
              case "$archive_path" in
                *.zip) unzip -q "$archive_path" -d "$extract_dir" ;;
                *) tar -xzf "$archive_path" -C "$extract_dir" ;;
              esac
            fi
            app_path="$(find "$artifacts_dir" -type d -name '*.app' | head -n 1 || true)"
          else
            app_path="$(find "$artifacts_dir" -type f -name '*.apk' | head -n 1 || true)"
          fi

          if [ -z "$app_path" ]; then
            echo "No ${{ matrix.platform }} app artifact found under $artifacts_dir" >&2
            find "$artifacts_dir" -maxdepth 5 -print >&2 || true
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "MOBILE_APP_PATH=$GITHUB_WORKSPACE/$app_path" >> "$GITHUB_ENV"
          echo "MOBILE_E2E_PLATFORM=${{ matrix.platform }}" >> "$GITHUB_ENV"
          echo "MOBILE_E2E_TEST_MODE=${{ matrix.test_mode }}" >> "$GITHUB_ENV"
          echo "Found app artifact: $app_path"

      - name: Install mobile E2E dependencies
        working-directory: tests/mobile-e2e
        run: npm ci

      - name: Install Appium driver
        working-directory: tests/mobile-e2e
        run: npx appium driver install ${{ matrix.appium_driver }}

      - name: Start server
        shell: bash
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          nohup pnpm start > "$ARTIFACTS_DIR/server.log" 2>&1 &
          echo $! > "$ARTIFACTS_DIR/server.pid"
          for i in {1..60}; do
            if curl -fsS "$HOST_SITE_URL" >/dev/null; then
              echo "Server is ready at $HOST_SITE_URL"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready" >&2
          cat "$ARTIFACTS_DIR/server.log" >&2 || true
          exit 1
        env:
          PORT: ${{ env.PORT }}
          SERVER_PORT: ${{ env.SERVER_PORT }}
          PUBLIC_SITE_URL: ${{ env.MOBILE_E2E_SITE_URL }}
          EXPO_PUBLIC_SITE_URL: ${{ env.MOBILE_E2E_SITE_URL }}

      - name: Run Android WebView E2E test
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -u
            mkdir -p "$ARTIFACTS_DIR/screenshots" "$ARTIFACTS_DIR/videos"
            adb devices
            adb exec-out screencap -p > "$ARTIFACTS_DIR/screenshots/android-before-test.png" || true
            adb shell screenrecord --bugreport /sdcard/mobile-e2e.mp4 > "$ARTIFACTS_DIR/videos/android-screenrecord.log" 2>&1 &
            screenrecord_pid=$!
            set +e
            npm --prefix tests/mobile-e2e test
            status=$?
            adb exec-out screencap -p > "$ARTIFACTS_DIR/screenshots/android-after-test.png" || true
            kill -INT "$screenrecord_pid" >/dev/null 2>&1 || true
            wait "$screenrecord_pid" >/dev/null 2>&1 || true
            adb pull /sdcard/mobile-e2e.mp4 "$ARTIFACTS_DIR/videos/android-mobile-e2e.mp4" || true
            adb shell rm /sdcard/mobile-e2e.mp4 || true
            adb logcat -d > "$ARTIFACTS_DIR/logcat.txt" || true
            exit $status

      - name: Run iOS WebView E2E test
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_DIR/screenshots" "$ARTIFACTS_DIR/videos"
          xcrun simctl list devices available
          device_info="$(IOS_DEVICE_NAME="${IOS_DEVICE_NAME:-iPhone 16}" python3 <<'PY'
          import json
          import os
          import subprocess

          preferred = os.environ["IOS_DEVICE_NAME"]
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          choices = []
          for runtime, devices in data.get("devices", {}).items():
              if not runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-"):
                  continue
              version = runtime.rsplit("iOS-", 1)[1].replace("-", ".")
              for device in devices:
                  if not device.get("isAvailable", False):
                      continue
                  choices.append((device.get("name"), device.get("udid"), version))

          selected = next((item for item in choices if item[0] == preferred), None)
          if selected is None:
              selected = next((item for item in choices if str(item[0]).startswith("iPhone ")), None)
          if selected is None:
              raise SystemExit("No available iPhone simulator found")
          print("|".join(selected))
          PY
          )"
          IFS='|' read -r device_name device_udid platform_version <<< "$device_info"
          echo "Using iOS simulator: $device_name ($device_udid), iOS $platform_version"
          echo "IOS_DEVICE_NAME=$device_name" >> "$GITHUB_ENV"
          echo "IOS_DEVICE_UDID=$device_udid" >> "$GITHUB_ENV"
          echo "IOS_PLATFORM_VERSION=$platform_version" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_udid" || true
          xcrun simctl bootstatus "$device_udid" -b
          xcrun simctl io "$device_udid" screenshot "$ARTIFACTS_DIR/screenshots/ios-before-test.png" || true
          xcrun simctl io "$device_udid" recordVideo --codec=h264 "$ARTIFACTS_DIR/videos/ios-mobile-e2e.mp4" > "$ARTIFACTS_DIR/videos/ios-record-video.log" 2>&1 &
          record_video_pid=$!
          set +e
          IOS_DEVICE_NAME="$device_name" IOS_DEVICE_UDID="$device_udid" IOS_PLATFORM_VERSION="$platform_version" npm --prefix tests/mobile-e2e test
          status=$?
          xcrun simctl io "$device_udid" screenshot "$ARTIFACTS_DIR/screenshots/ios-after-test.png" || true
          kill -INT "$record_video_pid" >/dev/null 2>&1 || true
          wait "$record_video_pid" >/dev/null 2>&1 || true
          xcrun simctl diagnose "$device_udid" -l "$ARTIFACTS_DIR/ios-simulator-diagnostics" || true
          exit $status

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f "$ARTIFACTS_DIR/server.pid" ]; then
            kill "$(cat "$ARTIFACTS_DIR/server.pid")" || true
          fi

      - name: Upload mobile E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.platform }}-${{ matrix.test_mode }}-e2e-artifacts
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 5
