name: VK mocked sandbox e2e

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  RUST_TOOLCHAIN: nightly-2025-12-04
  VK_REPOSITORY: mickmister/vibe-kanban

jobs:
  vk-mocked-sandbox-e2e:
    name: VK mocked sandbox e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve matching VK branch
        id: resolve-vk-ref
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          vk_repo_url="https://github.com/${VK_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$vk_repo_url" "$candidate" >/dev/null; then
            vk_ref="$candidate"
            reason="matched branch"
          else
            vk_ref="main"
            reason="fallback"
          fi

          echo "ref=$vk_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved VK ref: $vk_ref ($reason for candidate: $candidate)"

      - name: Checkout VD
        uses: actions/checkout@v4
        with:
          path: vibe-kanban-vscode-web

      - name: Checkout VK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VK_REPOSITORY }}
          ref: ${{ steps.resolve-vk-ref.outputs.ref }}
          path: Vktest

      - name: Record VK commit
        id: vk-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C Vktest rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C Vktest log --oneline -1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            vibe-kanban-vscode-web/pnpm-lock.yaml
            Vktest/pnpm-lock.yaml

      - name: Setup Go for Caddy
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.7

      - name: Install Caddy
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup sccache
        uses: BloopAI/sccache-action@main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Restore Rust caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: Vktest
          shared-key: vk-mocked-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ steps.vk-meta.outputs.sha }}
          cache-provider: github
          cache-on-failure: "true"

      - name: Restore VK local-web dist
        id: vk-local-web-dist-cache
        uses: actions/cache@v4
        with:
          path: Vktest/packages/local-web/dist
          key: vk-local-web-dist-${{ runner.os }}-${{ steps.vk-meta.outputs.sha }}
          restore-keys: |
            vk-local-web-dist-${{ runner.os }}-

      - name: Use cached VK local-web dist when available
        if: steps.vk-local-web-dist-cache.outputs.cache-hit == 'true'
        run: echo "VK_MOCKED_SKIP_LOCAL_WEB_BUILD=1" >> "$GITHUB_ENV"

      - name: Install VD dependencies
        working-directory: vibe-kanban-vscode-web
        run: pnpm install --frozen-lockfile

      - name: Install VK dependencies
        working-directory: Vktest
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: vibe-kanban-vscode-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate VK mocked sandbox fixture
        working-directory: vibe-kanban-vscode-web
        run: npm run e2e:vk-mocked-sandbox:validate -- --variant basic-seeded

      - name: Run VK mocked sandbox e2e
        working-directory: vibe-kanban-vscode-web
        run: npm run test:e2e:vk-mocked-sandbox

      - name: Upload VK mocked sandbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-mocked-sandbox-artifacts
          path: |
            vibe-kanban-vscode-web/playwright-report
            vibe-kanban-vscode-web/test-results
            vibe-kanban-vscode-web/.vk-mocked-sandbox/current
            Vktest/dev_assets/sessions
          if-no-files-found: ignore
